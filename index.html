 {st:'ok'|'skip', tgl, n}. Stok sistem baru berubah setelah konfirmasi, dan tercatat di Riwayat Stok. */
let SLF = "wait";
function selItems() {
  const out = [];
  D.chk.forEach((c) => {
    if (c.st !== "selesai" || !c.sel || !c.snap) return;
    c.snap.forEach((r) => {
      if (r.fis == null) return;
      const d = r.fis - r.sis;
      if (!d) return;
      out.push({ c, r, d, a: c.adj && c.adj[r.pid] });
    });
  });
  return out.reverse();
}
const selN = () => {
  try {
    return selItems().filter((x) => !x.a).length;
  } catch (e) {
    return 0;
  }
};
function selOld() {
  const o = {};
  let n = 0;
  D.chk.forEach((c) => {
    if (c.st !== "selesai" || c.sel || !c.snap) return;
    const k = c.snap.filter((r) => r.fis != null && r.fis !== r.sis).length;
    if (k) {
      o[c.id] = 1;
      n += k;
    }
  });
  return { n, ids: Object.keys(o) };
}
function selApplyOne(c, pid) {
  const r = c.snap.find((x) => x.pid === pid), p = D.prod.find((x) => x.id === pid);
  if (!r || c.adj && c.adj[pid]) return 0;
  if (!p) return -1;
  const d = r.fis - r.sis;
  let n = Math.abs(d);
  const t = today();
  if (d < 0) {
    n = Math.min(n, Math.max(0, +p.stok || 0));
    p.stok = (+p.stok || 0) - n;
    if (n > 0) D.moves.push({ pid, qty: n, tgl: t, t: "tk", src: "sel" });
  } else {
    p.stok = (+p.stok || 0) + n;
    D.moves.push({ pid, qty: n, tgl: t, src: "sel" });
  }
  (c.adj || (c.adj = {}))[pid] = { st: "ok", tgl: t, n: d < 0 ? -n : n };
  return 1;
}
const selDlg = (ic, h, msg, btn, fn, bg) => {
  $("wb").innerHTML = `<i>${ic}</i><h4>${h}</h4><p>${msg}</p><div class="row"><button class="btn" style="background:var(--line);color:#232a45;flex:1" onclick="$('warn').classList.remove('on')">Batal</button><button class="btn" style="background:${bg || "#ecd9a8"};flex:1" onclick="${fn}">${btn}</button></div>`;
  $("warn").classList.add("on");
};
function selAsk(cid, pid) {
  const c = D.chk.find((x) => x.id === cid), r = c && c.snap.find((x) => x.pid === pid), p = D.prod.find((x) => x.id === pid);
  if (!r) return;
  if (!p) return toast("Barang sudah tidak ada di Data Produk");
  const d = r.fis - r.sis, now = Math.max(0, +p.stok || 0), nw = Math.max(0, now + d);
  selDlg(d > 0 ? "➕" : "➖", d > 0 ? "Tambah stok sistem?" : "Kurangi stok sistem?", `<b>${esc(p.nama)}</b><br>Stok sistem sekarang ${esc(fqp(p, now))}<br>menjadi <b>${esc(fqp(p, nw))}</b> (${d > 0 ? "Plus +" : "Minus −"}${esc(fqp(p, Math.abs(d)))})<br>Tercatat di Riwayat Stok.`, "Ya, Sesuaikan", `selDo('${cid}','${pid}')`);
}
function selDo(cid, pid) {
  const c = D.chk.find((x) => x.id === cid);
  if (!c) return;
  const r = selApplyOne(c, pid);
  save();
  $("warn").classList.remove("on");
  toast(r > 0 ? "Stok sistem sudah disesuaikan" : "Tidak ada yang diubah");
  render();
}
function selSkip(cid, pid) {
  const c = D.chk.find((x) => x.id === cid);
  if (!c) return;
  (c.adj || (c.adj = {}))[pid] = { st: "skip", tgl: today() };
  save();
  render();
}
function selBack(cid, pid) {
  const c = D.chk.find((x) => x.id === cid);
  if (!c || !c.adj) return;
  delete c.adj[pid];
  save();
  render();
}
function selAllAsk() {
  const w = selItems().filter((x) => !x.a && D.prod.some((p) => p.id === x.r.pid)), pl = w.filter((x) => x.d > 0).length, mn = w.length - pl;
  if (!w.length) return toast("Tidak ada selisih yang menunggu");
  selDlg("⚖️", "Sesuaikan semua selisih?", `${w.length} barang akan disesuaikan.<br><b>${pl}</b> barang Plus menambah stok sistem, <b>${mn}</b> barang Minus mengurangi stok sistem.<br>Tercatat di Riwayat Stok.`, "Ya, Sesuaikan Semua", "selAllDo()");
}
function selAllDo() {
  let n = 0;
  selItems().filter((x) => !x.a).forEach((x) => {
    if (selApplyOne(x.c, x.r.pid) > 0) n++;

  save();
  $("warn").classList.remove("on");
  toast(n + " barang disesuaikan");
  render();
}

}

function vSel() {
  const L = selItems(), w = L.filter((x) => !x.a), pl = w.filter((x) => x.d > 0).length, mn = w.length - pl, dn = L.filter((x) => x.a).length, old = selOld();
  $("acts").innerHTML = L.length ? `<button class="ib" onclick="selExp()">Excel</button>` : "";
  const ch = (k, l, n) => `<button class="chip${SLF === k ? " on" : ""}" onclick="SLF='${k}';LM=60;render()">${l} (${n})</button>`;
  let R = L;
  if (SLF === "wait") R = w;
  else if (SLF === "plus") R = w.filter((x) => x.d > 0);
  else if (SLF === "minus") R = w.filter((x) => x.d < 0);
  else if (SLF === "done") R = L.filter((x) => x.a);
  const card = (x) => {
    const r = x.r, a = x.a, up = x.d > 0, U = r, fqd = esc(fq(Math.abs(x.d), r.isi, r.sb, r.satuan, r.sm, r.ir));

  };
  return `<div class="sm" style="margin:2px 2px 10px">Barang selisih dari Cek Stok yang sudah Selesai. Stok sistem baru berubah setelah Anda sesuaikan.</div><div class="ckh"><div class="cks"><b>${w.length}</b> menunggu <span class="g">Plus ${pl}</span><span class="r">Minus ${mn}</span></div></div>` + (old.n ? `<div class="entri" onclick="selOldAsk()"><span>📂 ${old.n} selisih dari cek lama</span><span>›</span></div>` : "") + `<div class="chips">${ch("wait", "Menunggu", w.length)}${ch("plus", "Plus", pl)}${ch("minus", "Minus", mn)}${ch("done", "Selesai", dn)}</div>` + (R.length ? R.slice(0, LM).map(card).join("") + (R.length > LM ? more("render", R.length) : "") : `<div class="empty">${L.length ? "Tidak ada barang di daftar ini." : "Belum ada selisih.<br>Selisih muncul setelah Cek Stok diselesaikan."}</div>`) + (w.length ? `<div style="height:84px"></div><div class="bar"><span>${w.length} menunggu<small>${pl} Plus • ${mn} Minus</small></span><button class="btn pri ckdone" onclick="selAllAsk()">✓ Sesuaikan Semua</button></div>` : "");

(() => {
  let sx = 0, sy = 0, tr = 0, mode2 = "";
  document.addEventListener("touchstart", (e) => {
    const t = e.touches[0];
    sx = t.clientX;
    sy = t.clientY;
    tr = 1;
    const d = document.getElementById("dr");
    mode2 = d && d.classList.contains("on") ? "close" : sx <= 18 ? "open" : "";
  }, { passive: true });
  document.addEventListener("touchmove", (e) => {
    if (!tr || !mode2) return;

function sC(id) {

  if (!o.nama) return toast("Nama wajib diisi");
  if (D.cust.some((c) => c.nama === o.nama && c.id !== id)) return toast("Customer dengan nama ini sudah ada");
  if (id) {
    const c0 = D.cust.find((x) => x.id === id);
    if (!c0) return cl();
    const old = c0.nama;
    Object.assign(c0, o);
    D.sales.forEach((x) => {

  $("wb").innerHTML = `<i>⚠️</i><h4>Pulihkan salinan otomatis?</h4><p>Semua data sekarang akan <b>diganti</b> dengan salinan tanggal <b>${esc(k.slice(5))}</b>.</p><div class="row"><button class="btn" style="background:var(--line);color:#232a45;flex:1" onclick="IMPFN=null;$('warn').classList.remove('on')">Batal</button><button class="btn" style="background:#e6b8bd;flex:1" onclick="impGo()">Ya, pulihkan</button></div>`;
  $("warn").classList.add("on");
}
function bkRemind() {
  try {
    if (LK || document.getElementById("wel")) return;
    if (!D.sales.length && !D.prod.length) return;
    const t = today();
    if (D.set.bkAsk === t) return;
    const hr = D.set.bk ? (Date.now() - D.set.bk) / 864e5 : 99;

    $("warn").classList.add("on");
  } catch (e) {
  }
}
applyZoom();
lockShow();
$("welT").textContent = D.toko;

render();
if (!D.set.welcome) {
  const w = document.getElementById("wel");
  if (w) {

}
function puHome() {
  const h = document.documentElement;
  if (h.getAttribute("data-th") !== "putih" || view !== "home") return;
  const g = document.querySelector(".cs-grid");
  if (!g || g.dataset.pu) return;
  g.dataset.pu = "1";
  const by = {};
  g.querySelectorAll(":scope>.cs-tile").forEach((b) => {
    const m = /go\('(\w+)'\)/.exec(b.getAttribute("onclick") || "");
    if (m) by[m[1]] = b;
  });
  const G = [["Transaksi", ["jual", "trx", "cus", "kel"]], ["Barang", ["prod", "stok", "cek", "sel", "trf"]], ["Laporan dan pengaturan", ["lap", "laba", "set"]]];
  let last = null;
  G.forEach(([t, ks]) => {
    const els = ks.map((k) => by[k]).filter(Boolean);
    if (!els.length) return;
    const l = document.createElement("div");
    l.className = "pu-t";
    l.textContent = t;
    const c = document.createElement("div");
    c.className = "pu-c";
    els.forEach((e) => c.appendChild(e));
    g.appendChild(l);
    g.appendChild(c);
    last = c;
  });
  g.querySelectorAll(":scope>.cs-tile").forEach((b) => {
    if (last) last.appendChild(b);
  });
}
(() => {
  const r = render;
  render = function() {
    const x = r.apply(this, arguments);
    try {
      puHome();
    } catch (e) {
    }
    return x;
  };
})();
</script>
<script>
/* ===== PENYIMPANAN: IndexedDB sebagai utama (tanpa batas 5 MB), localStorage sebagai cadangan cepat ===== */
(function () {
  var DBN = 'kasir-db', ST = 'kv', LS = window.localStorage, P = Storage.prototype;
  var gI = P.getItem, sI = P.setItem, rI = P.removeItem;
  var db = null, mem = null, pend = null, busy = false, bad = false, started = false, dirty = false, snapAt = Date.now(), waiters = [];

  function openDB(cb) {
    try {
      var q = indexedDB.open(DBN, 1);
      q.onupgradeneeded = function () { q.result.createObjectStore(ST); };
      q.onsuccess = function () { cb(q.result); };
      q.onerror = q.onblocked = function () { cb(null); };
    } catch (e) { cb(null); }
  }
  function rd(k) {
    return new Promise(function (res) {
      try { var t = db.transaction(ST).objectStore(ST).get(k); t.onsuccess = function () { res(t.result); }; t.onerror = function () { res(null); }; }
      catch (e) { res(null); }
    });
  }
  function wr(k, v) {
    return new Promise(function (res) {
      try { var t = db.transaction(ST, 'readwrite'); t.objectStore(ST).put(v, k); t.oncomplete = function () { res(true); }; t.onerror = t.onabort = function () { res(false); }; }
      catch (e) { res(false); }
    });
  }
  function del(k) {
    return new Promise(function (res) {
      try { var t = db.transaction(ST, 'readwrite'); t.objectStore(ST).delete(k); t.oncomplete = function () { res(); }; t.onerror = t.onabort = function () { res(); }; }
      catch (e) { res(); }
    });
  }
  function keys() {
    return new Promise(function (res) {
      try { var t = db.transaction(ST).objectStore(ST).getAllKeys(); t.onsuccess = function () { res(t.result || []); }; t.onerror = function () { res([]); }; }
      catch (e) { res([]); }
    });
  }
  function dayKey(ts) {
    var d = new Date(ts);
    return 'snap-' + d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function flush() {
    if (busy || !pend || !db) return;
    busy = true;
    var p = pend; pend = null;
    wr('kasir', p).then(function (ok) {
      bad = !ok;
      var snap = Promise.resolve();
      if (ok && Date.now() - snapAt > 30 * 60 * 1000) {
        snapAt = Date.now();
        snap = wr(dayKey(p.ts), p).then(function () { return wr('snapmeta', { ts: snapAt }); }).then(function () { return keys(); }).then(function (ks) {
          var old = ks.filter(function (k) { return /^snap-/.test(k); }).sort().reverse().slice(7);
          return Promise.all(old.map(del));
        });
      }
      return snap;
    }).then(function () {
      busy = false;
      if (pend) flush();
      else waiters.splice(0).forEach(function (f) { f(); });
    });
  }

  window.KS_flush = function () {
    return new Promise(function (res) { if (!pend && !busy) res(); else { waiters.push(res); flush(); } });
  };
  window.KS_snaps = function () {
    if (!db) return Promise.resolve([]);
    return keys().then(function (ks) {
      var L = ks.filter(function (k) { return /^snap-\d/.test(k); }).sort().reverse();
      return Promise.all(L.map(function (k) { return rd(k).then(function (r) { return { k: k, ts: r ? r.ts : 0, kb: r ? Math.round(r.v.length / 512) : 0 }; }); }));
    });
  };
  window.KS_snapGet = function (k) { return rd(k).then(function (r) { return r ? r.v : null; }); };
  window.KS_ready = function () { return !!db && started; };

  function patch() {
    P.getItem = function (k) { return (this === LS && k === 'kasir') ? mem : gI.apply(this, arguments); };
    P.setItem = function (k, v) {
      if (this === LS && k === 'kasir') {
        var str = String(v), ts = Date.now(), err = null;
        mem = str; dirty = true;
        try { sI.call(LS, 'kasir', str); sI.call(LS, 'kasir_ts', String(ts)); }
        catch (e) {
          err = e;
          try { rI.call(LS, 'kasir'); } catch (_) {}
          try { sI.call(LS, 'kasir_ts', String(ts)); } catch (_) {}
        }
        pend = { v: str, ts: ts };
        flush();
        if (err && bad) throw err;
        return;
      }
      return sI.apply(this, arguments);
    };
  }

  function boot() {
    if (started) return;
    started = true;
    var src = document.getElementById('app-src');
    var el = document.createElement('script');
    el.text = src.textContent;
    document.body.appendChild(el);
    document.documentElement.classList.add('rdy');
  }

  /* Jalur cepat: kalau data sudah ada di localStorage, aplikasi langsung dibuka.
     IndexedDB disambungkan di belakang layar setelah aplikasi tampil. */
  var lv0 = gI.call(LS, 'kasir'), lt0 = +gI.call(LS, 'kasir_ts') || 0;

  function reconcile(d) {
    db = d;
    rd('kasir').then(function (rec) {
      if (rec && rec.v && rec.ts > lt0 && rec.v !== mem && !dirty && !sessionStorage.getItem('ks_rl')) {
        try { sessionStorage.setItem('ks_rl', '1'); } catch (_) {}
        location.reload();
        return;
      }
      return rd('snapmeta').then(function (meta) {
        if (!meta || Date.now() - meta.ts > 30 * 60 * 1000) snapAt = 0;
        var legacy = gI.call(LS, 'kasir_cadangan_sebelum_3satuan'), step = Promise.resolve();
        if (legacy) {
          step = wr('legacy-sebelum-3satuan', { v: legacy, ts: Date.now() }).then(function (ok) {
            if (ok) { try { rI.call(LS, 'kasir_cadangan_sebelum_3satuan'); } catch (_) {} }
          });
        }
        return step;
      }).then(function () {
        if (mem && !dirty && (!rec || rec.v !== mem)) pend = { v: mem, ts: lt0 || Date.now() };
        flush();
        try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (_) {}
      });
    });
  }

  if (lv0) {
    mem = lv0;
    patch();
    boot();
    setTimeout(function () { openDB(function (d) { if (d) reconcile(d); }); }, 800);
    return;
  }

  /* Jalur lambat (pemasangan baru / data besar yang hanya ada di IndexedDB) */
  var timer = setTimeout(function () { if (!db) boot(); }, 2500);
  openDB(function (d) {
    if (!d) { clearTimeout(timer); boot(); return; }
    if (started) return;
    db = d;
    rd('kasir').then(function (rec) {
      if (started) return;
      mem = rec && rec.v ? rec.v : null;
      var legacy = gI.call(LS, 'kasir_cadangan_sebelum_3satuan');
      var step = Promise.resolve();
      if (legacy) {
        step = wr('legacy-sebelum-3satuan', { v: legacy, ts: Date.now() }).then(function (ok) {
          if (ok) { try { rI.call(LS, 'kasir_cadangan_sebelum_3satuan'); } catch (_) {} }
        });
      }
      step.then(function () {
        if (started) return;
        patch();
        clearTimeout(timer);
        boot();
        flush();
        try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (_) {}
      });
    });
  });
})();
