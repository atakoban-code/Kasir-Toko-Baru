<!DOCTYPE html><html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10131c"><link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>Kasir Toko</title>
<style>
:root{--bg:#10131c;--card:#181c28;--ln:#2a3042;--gold:#c9a96a;--iv:#f5efe3;--mut:#8b90a0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--iv);font:15px/1.4 system-ui,sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);display:flex;flex-direction:column;user-select:none}
.sf{font-family:"Cormorant Garamond",Georgia,serif}
#sp{position:fixed;inset:0;z-index:99;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;transition:opacity .7s}
#sp.out{opacity:0;pointer-events:none}
.ring{fill:none;stroke:var(--gold);stroke-width:1.5;stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.5s ease forwards}
.mk{fill:var(--gold);opacity:0;animation:fi .8s .9s forwards}
#sp h1{margin:0;font:500 30px "Cormorant Garamond",Georgia,serif;letter-spacing:.6em;padding-left:.6em;opacity:0;animation:tt 1.3s 1.1s ease forwards}
@keyframes dr{to{stroke-dashoffset:0}}@keyframes fi{to{opacity:1}}
@keyframes tt{to{opacity:1;letter-spacing:.28em;padding-left:.28em}}
@media(prefers-reduced-motion:reduce){#sp *{animation-duration:.01s!important;animation-delay:0s!important}}
header{padding:14px 18px;border-bottom:1px solid var(--ln);display:flex;justify-content:space-between;align-items:baseline}
header h2{margin:0;font:600 26px "Cormorant Garamond",Georgia,serif;color:var(--gold);letter-spacing:.04em}
header small{color:var(--mut)}header b{color:var(--iv);margin-left:6px}
main{flex:1;overflow:auto;padding:14px 16px}
nav{display:flex;border-top:1px solid var(--ln);background:var(--card)}
nav button{flex:1;padding:15px;background:none;border:0;color:var(--mut);font:600 14px system-ui}
nav .on{color:var(--gold);box-shadow:inset 0 2px var(--gold)}
.g{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px}
.it{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:12px;text-align:left;color:var(--iv);font:inherit}
.it b{display:block;margin-bottom:2px}.it span{color:var(--gold)}
.r{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln)}
.r small{color:var(--mut)}
.q{width:34px;height:34px;border-radius:50%;border:1px solid var(--gold);background:none;color:var(--gold);font-size:18px}
.qn{display:inline-block;min-width:26px;text-align:center}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;font:600 28px "Cormorant Garamond",Georgia,serif}
.pay,.add{width:100%;padding:15px;border:0;border-radius:10px;background:var(--gold);color:#10131c;font:700 16px system-ui;margin-top:12px}
.pay:disabled{opacity:.35}
input{width:100%;padding:13px;margin-bottom:8px;background:var(--card);border:1px solid var(--ln);border-radius:8px;color:var(--iv);font:inherit;user-select:text}
.em{color:var(--mut);text-align:center;margin-top:40px}
.del{background:none;border:0;color:#d98b8b;font:inherit}
#ts{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--gold);color:#10131c;padding:10px 18px;border-radius:20px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none}
#ts.on{opacity:1}
</style></head><body>
<div id="sp"><svg viewBox="0 0 120 120" width="120" height="120"><circle class="ring" cx="60" cy="60" r="54" pathLength="1"/><text class="mk" x="60" y="75" text-anchor="middle" font-size="44" font-family="Georgia,serif">K</text></svg><h1>KASIR TOKO</h1></div>
<header><h2>Kasir Toko</h2><small>Hari ini<b id="td">Rp0</b></small></header>
<main id="m"></main>
<nav><button data-t="k">Kasir</button><button data-t="p">Produk</button><button data-t="h">Riwayat</button></nav>
<div id="ts"></div>
<script>
const $=id=>document.getElementById(id);
let S={p:[],h:[]};try{S=JSON.parse(localStorage.getItem('kt'))||S}catch(e){}
let cart={},tab='k';
const save=()=>{try{localStorage.setItem('kt',JSON.stringify(S))}catch(e){}};
const rp=n=>'Rp'+n.toLocaleString('id-ID');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){const e=$('ts');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1600)}
function kasir(){
  if(!S.p.length)return '<p class="em">Belum ada barang. Buka tab Produk untuk menambah barang.</p>';
  let h='<div class="g">'+S.p.map((p,i)=>`<button class="it" onclick="add(${i})"><b>${esc(p.n)}</b><span>${rp(p.h)}</span></button>`).join('')+'</div>';
  const ks=Object.keys(cart);let tot=0;
  h+=ks.map(i=>{const p=S.p[i],q=cart[i];tot+=p.h*q;return `<div class="r"><div>${esc(p.n)}<br><small>${rp(p.h)}</small></div><div><button class="q" onclick="chg(${i},-1)">−</button><span class="qn">${q}</span><button class="q" onclick="chg(${i},1)">+</button></div></div>`}).join('');
  return h+`<div class="tot"><span>Total</span><span>${rp(tot)}</span></div><button class="pay" onclick="pay()" ${ks.length?'':'disabled'}>Bayar</button>`;
}
function produk(){
  return '<input id="pn" placeholder="Nama barang"><input id="ph" placeholder="Harga (angka)" inputmode="numeric"><button class="add" onclick="addP()">Tambah barang</button><div style="height:14px"></div>'+
  S.p.map((p,i)=>`<div class="r"><div>${esc(p.n)}<br><small>${rp(p.h)}</small></div><button class="del" onclick="delP(${i})">Hapus</button></div>`).join('');
}
function riwayat(){
  if(!S.h.length)return '<p class="em">Belum ada transaksi.</p>';
  return S.h.slice(0,100).map(x=>`<div class="r"><div><b>${new Date(x.t).toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</b><br><small>${x.i.map(y=>esc(y.n)+' ×'+y.q).join(', ')}</small></div><b>${rp(x.tot)}</b></div>`).join('');
}
function render(){
  const d=new Date().toDateString();
  $('td').textContent=rp(S.h.filter(x=>new Date(x.t).toDateString()===d).reduce((a,x)=>a+x.tot,0));
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  $('m').innerHTML=tab==='k'?kasir():tab==='p'?produk():riwayat();
}
function add(i){cart[i]=(cart[i]||0)+1;render()}
function chg(i,d){cart[i]+=d;if(cart[i]<=0)delete cart[i];render()}
function pay(){const ks=Object.keys(cart);if(!ks.length)return;
  const i=ks.map(k=>({n:S.p[k].n,q:cart[k],h:S.p[k].h}));
  S.h.unshift({t:Date.now(),i,tot:i.reduce((a,x)=>a+x.q*x.h,0)});save();cart={};toast('Transaksi tersimpan');render()}
function addP(){const n=$('pn').value.trim(),h=parseInt($('ph').value,10);
  if(!n||!(h>0)){toast('Isi nama dan harga barang');return}
  S.p.push({n,h});save();toast('Barang ditambahkan');render()}
function delP(i){if(!confirm('Hapus barang ini?'))return;S.p.splice(i,1);cart={};save();render()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
render();
setTimeout(()=>{$('sp').classList.add('out');setTimeout(()=>$('sp').remove(),800)},2900);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
